version: "3.8"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  yugabyted:
    image: yugabytedb/yugabyte:latest
    restart: unless-stopped
    command: ["/bin/bash", "-lc", "/home/yugabyte/bin/yugabyted start --daemon=false --ui=false --tserver_flags=ysql_num_shards_per_tserver=1"]
    ports:
      - "5433:5433"   # YSQL
      - "7000:7000"   # Master UI
      - "9000:9000"   # TServer UI
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'pg_isready -h 127.0.0.1 -p 5433' "]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - ybdata:/root/var/data

volumes:
  pgdata: {}
  ybdata: {}
